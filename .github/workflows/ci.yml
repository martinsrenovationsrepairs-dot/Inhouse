name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Test and build (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix frontend ci --include=dev

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build frontend
        run: npm --prefix frontend run build
        env:
          VITE_SITE_URL: ${{ vars.PRODUCTION_URL || 'https://example.com' }}

      - name: Upload production frontend
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Assemble Hostinger release
        if: github.event_name != 'pull_request'
        run: bash scripts/ci/assemble-hostinger-release.sh

      - name: Upload Hostinger release
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: hostinger-node-release
          path: SiteGervas-Hostinger-Node-ready.zip
          if-no-files-found: error
          retention-days: 14
