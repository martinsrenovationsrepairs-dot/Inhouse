name: Deploy to Hostinger

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Production deployment
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Resolve commit
        id: revision
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout successful revision
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.revision.outputs.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install and build
        run: |
          npm ci
          npm test
          npm run build
        env:
          VITE_SITE_URL: ${{ vars.PRODUCTION_URL }}

      - name: Validate deployment configuration
        env:
          DEPLOY_HOST: ${{ secrets.HOSTINGER_HOST }}
          DEPLOY_USER: ${{ secrets.HOSTINGER_USERNAME }}
          DEPLOY_PATH: ${{ secrets.HOSTINGER_DEPLOY_PATH }}
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$SSH_KEY"
          case "$DEPLOY_PATH" in
            ""|"/") echo "HOSTINGER_DEPLOY_PATH must be a non-root absolute path" >&2; exit 1 ;;
            /*) ;;
            *) echo "HOSTINGER_DEPLOY_PATH must be absolute" >&2; exit 1 ;;
          esac

      - name: Create production package
        run: |
          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env*' \
            --exclude='node_modules' \
            --exclude='frontend/node_modules' \
            --exclude='frontend/.generated-public' \
            --exclude='storage' \
            --exclude='database/database.sqlite' \
            --exclude='*.zip' \
            -czf deployment.tgz \
            package.json package-lock.json server dist README.md HOSTINGER.md

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ secrets.HOSTINGER_HOST }}
          DEPLOY_PORT: ${{ secrets.HOSTINGER_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hostinger
          chmod 600 ~/.ssh/hostinger
          ssh-keyscan -p "${DEPLOY_PORT:-22}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Upload package
        env:
          DEPLOY_HOST: ${{ secrets.HOSTINGER_HOST }}
          DEPLOY_USER: ${{ secrets.HOSTINGER_USERNAME }}
          DEPLOY_PORT: ${{ secrets.HOSTINGER_PORT }}
          DEPLOY_PATH: ${{ secrets.HOSTINGER_DEPLOY_PATH }}
          REVISION: ${{ steps.revision.outputs.sha }}
        run: |
          ssh -i ~/.ssh/hostinger -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$DEPLOY_PATH/releases/$REVISION'"
          scp -i ~/.ssh/hostinger -P "${DEPLOY_PORT:-22}" deployment.tgz \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/releases/$REVISION/deployment.tgz"

      - name: Activate release
        env:
          DEPLOY_HOST: ${{ secrets.HOSTINGER_HOST }}
          DEPLOY_USER: ${{ secrets.HOSTINGER_USERNAME }}
          DEPLOY_PORT: ${{ secrets.HOSTINGER_PORT }}
          DEPLOY_PATH: ${{ secrets.HOSTINGER_DEPLOY_PATH }}
          REVISION: ${{ steps.revision.outputs.sha }}
        run: |
          ssh -i ~/.ssh/hostinger -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' REVISION='$REVISION' bash -s" <<'REMOTE'
          set -euo pipefail
          release="$DEPLOY_PATH/releases/$REVISION"
          cd "$release"
          tar -xzf deployment.tgz
          rm deployment.tgz
          npm ci --omit=dev
          ln -sfn "$release" "$DEPLOY_PATH/current.next"
          mv -Tf "$DEPLOY_PATH/current.next" "$DEPLOY_PATH/current"
          cd "$DEPLOY_PATH/releases"
          ls -1dt -- */ | tail -n +6 | xargs -r rm -rf --
          REMOTE

      - name: Restart application
        if: ${{ vars.HOSTINGER_RESTART_COMMAND != '' }}
        env:
          DEPLOY_HOST: ${{ secrets.HOSTINGER_HOST }}
          DEPLOY_USER: ${{ secrets.HOSTINGER_USERNAME }}
          DEPLOY_PORT: ${{ secrets.HOSTINGER_PORT }}
          DEPLOY_PATH: ${{ secrets.HOSTINGER_DEPLOY_PATH }}
          RESTART_COMMAND: ${{ vars.HOSTINGER_RESTART_COMMAND }}
        run: |
          ssh -i ~/.ssh/hostinger -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH/current' && $RESTART_COMMAND"

      - name: Health check
        if: ${{ vars.PRODUCTION_URL != '' }}
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: curl --fail --show-error --silent --retry 6 --retry-delay 10 "$PRODUCTION_URL/api/status"

